name: Core Plugin CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "plugin/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/core-plugin-ci.yml"
      - ".github/workflows/core-plugin-release.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/core-plugin-ci.yml"
      - ".github/workflows/core-plugin-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-tests:
    name: Protocol, conformance, and Adapter equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Generated protocol freshness
        run: bun run plugin:protocol:check
      - name: TypeScript, Python, and Rust conformance
        run: bun run plugin:protocol:conformance
      - name: Typecheck
        run: bun run plugin:typecheck
      - name: Lint
        run: bun run plugin:lint
      - name: Unit, runtime, Hermes, and equivalence tests
        run: bun run plugin:test

  runtime-binary-smoke:
    name: Runtime binary (${{ matrix.target }})
    needs: protocol-and-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'linux-arm64'
        with:
          platforms: arm64
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build release bundle
        run: bun run plugin:release:runtime -- --target ${{ matrix.target }} --output release
      - name: Native runtime manifest, checksum, and protocol smoke
        if: matrix.target != 'linux-arm64'
        run: node plugin/scripts/smoke-runtime.mjs release/${{ matrix.target }}
      - name: Linux arm64 runtime smoke under QEMU
        if: matrix.target == 'linux-arm64'
        run: >-
          docker run --rm --platform linux/arm64
          -v "${{ github.workspace }}:/workspace" -w /workspace node:24-bookworm
          node plugin/scripts/smoke-runtime.mjs release/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: magic-context-${{ matrix.target }}
          path: release/${{ matrix.target }}/
          if-no-files-found: error

  hermes-install-doctor-migrate:
    name: Hermes install, doctor, and migration E2E
    needs: protocol-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --project hermes-agent --frozen
      - name: Build native runtime bundle
        run: bun run plugin:release:runtime -- --target linux-x64 --output release
      - name: Install bundle into isolated Hermes home
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: |
          hermes-agent/.venv/bin/python plugin/hermes-plugin/management.py install plugin/hermes-plugin --runtime release/linux-x64/magic-context-runtime --hermes-home "$HERMES_HOME"
          "$HERMES_HOME/plugins/magic-context/bin/magic-context-runtime" --protocol-info
      - name: Doctor installed plugin and packaged runtime
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: |
          hermes-agent/.venv/bin/python "$HERMES_HOME/plugins/magic-context/management.py" doctor --state-dir "$HERMES_HOME/state"
          hermes-agent/.venv/bin/python -c "from hermes_cli.plugin_dev import doctor_plugin; r=doctor_plugin('$HERMES_HOME/plugins/magic-context'); print(r.format_text()); raise SystemExit(0 if r.ok else 1)"
      - name: Migration dry run
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          LEGACY_STATE: ${{ runner.temp }}/legacy-runtime-v1
        run: |
          mkdir -p "$LEGACY_STATE"
          printf '%s\n' '{"schemaVersion":1,"host":"hermes","sessionId":"legacy"}' > "$LEGACY_STATE/session.json"
          hermes-agent/.venv/bin/python "$HERMES_HOME/plugins/magic-context/management.py" migrate "$LEGACY_STATE" --state-dir "$HERMES_HOME/state" --dry-run
      - name: Optional real provider/session E2E
        env:
          MAGIC_CONTEXT_LIVE_API_KEY: ${{ secrets.MAGIC_CONTEXT_LIVE_API_KEY }}
          MAGIC_CONTEXT_LIVE_MODEL: ${{ secrets.MAGIC_CONTEXT_LIVE_MODEL }}
          MAGIC_CONTEXT_LIVE_BASE_URL: ${{ secrets.MAGIC_CONTEXT_LIVE_BASE_URL }}
          MAGIC_CONTEXT_HERMES_ROOT: ${{ github.workspace }}/hermes-agent
        run: |
          if [[ -z "$MAGIC_CONTEXT_LIVE_API_KEY" || -z "$MAGIC_CONTEXT_LIVE_MODEL" ]]; then
            echo "Skipping optional live provider E2E: repository secrets are not configured."
            exit 0
          fi
          bun run --cwd plugin/runtime build
          hermes-agent/.venv/bin/python plugin/hermes-plugin/tests/live_provider_e2e.py
