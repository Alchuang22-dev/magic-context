name: Core Plugin Release

on:
  push:
    tags:
      - "core-plugin-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run plugin:protocol:check
      - run: bun run plugin:release:check
      - run: bun run plugin:protocol:conformance
      - run: bun run plugin:typecheck
      - run: bun run plugin:lint
      - run: bun run plugin:test

  build-runtime:
    name: Package ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'linux-arm64'
        with:
          platforms: arm64
      - run: bun install --frozen-lockfile
      - run: bun run plugin:release:runtime -- --target ${{ matrix.target }} --output release
      - name: Native release smoke
        if: matrix.target != 'linux-arm64'
        run: node plugin/scripts/smoke-runtime.mjs release/${{ matrix.target }}
      - name: Linux arm64 release smoke under QEMU
        if: matrix.target == 'linux-arm64'
        run: >-
          docker run --rm --platform linux/arm64
          -v "${{ github.workspace }}:/workspace" -w /workspace node:24-bookworm
          node plugin/scripts/smoke-runtime.mjs release/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/${{ matrix.target }}/
          if-no-files-found: error

  publish-npm:
    name: Publish protocol and runtime packages
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@11.6.2
      - run: bun install --frozen-lockfile
      - run: bun run plugin:build
      - name: Publish generated protocol first
        working-directory: plugin/protocol
        run: npm publish --access public --provenance
      - name: Publish Core Module
        working-directory: plugin/core-plugin
        run: npm publish --access public --provenance
      - name: Publish Runtime Module
        working-directory: plugin/runtime
        run: npm publish --access public --provenance

  github-release:
    name: Publish runtime archives
    needs: [build-runtime, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.tar.gz
            release/**/SHA256SUMS
            release/**/runtime-manifest.json
